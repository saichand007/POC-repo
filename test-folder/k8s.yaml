---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-frontend
  namespace: rca
  labels:
    app: rca-frontend
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rca-frontend
  template:
    metadata:
      labels:
        app: rca-frontend
    spec:
      containers:
        - name: rca-frontend
          image: your-acr.azurecr.io/rca-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 101        # nginx user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      imagePullSecrets:
        - name: acr-secret

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: rca-frontend-svc
  namespace: rca
spec:
  selector:
    app: rca-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

---
# Ingress (Azure Application Gateway / nginx ingress)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rca-frontend-ingress
  namespace: rca
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - rca.yourdomain.com
      secretName: rca-tls
  rules:
    - host: rca.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rca-frontend-svc
                port:
                  number: 80
